server {
    server_name vishwakarmabuildandfurnish.in;

    root /var/www/vishwakarmabuildandfurnish.in;
    index index.html;

    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://127.0.0.1:4001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:4001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy URL 301 Permanent Redirects for SEO & Soft 404 Prevention
    location = /services/furniture-services/office-furniture-charkhi-dadri {
        return 301 https://vishwakarmabuildandfurnish.in/services/wooden-work-services/customized-furniture-charkhi-dadri;
    }

    location = /services/furniture-services/reception-counter-charkhi-dadri {
        return 301 https://vishwakarmabuildandfurnish.in/services/wooden-work-services/customized-furniture-charkhi-dadri;
    }

    location = /services/interior-services/wall-panels-charkhi-dadri {
        return 301 https://vishwakarmabuildandfurnish.in/services/interior-services/tv-panel-design-charkhi-dadri;
    }

    location = /services/interior-services/curtains-and-blinds-charkhi-dadri {
        return 301 https://vishwakarmabuildandfurnish.in/services/interior-services/living-room-interior-charkhi-dadri;
    }

    location = /services/furniture-services {
        return 301 https://vishwakarmabuildandfurnish.in/services/wooden-work-services;
    }

    location ~* ^/services/furniture-services/(.*)$ {
        return 301 https://vishwakarmabuildandfurnish.in/services/wooden-work-services/$1;
    }

    location = /blogs/custom-office-furniture-designs-in-charkhi-dadri {
        return 301 https://vishwakarmabuildandfurnish.in/blogs/custom-furniture-designs-in-charkhi-dadri;
    }

    location = /blogs/custom-reception-counter-designs-in-charkhi-dadri {
        return 301 https://vishwakarmabuildandfurnish.in/blogs/custom-furniture-designs-in-charkhi-dadri;
    }

    location = /blogs/custom-wall-panels-designs-in-charkhi-dadri {
        return 301 https://vishwakarmabuildandfurnish.in/blogs/latest-tv-panel-designs-in-charkhi-dadri;
    }

    location = /blogs/custom-curtains-and-blinds-designs-in-charkhi-dadri {
        return 301 https://vishwakarmabuildandfurnish.in/blogs;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/vishwakarmabuildandfurnish.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vishwakarmabuildandfurnish.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# 301 Permanent Redirect: HTTPS www to non-www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.vishwakarmabuildandfurnish.in;

    ssl_certificate /etc/letsencrypt/live/vishwakarmabuildandfurnish.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vishwakarmabuildandfurnish.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://vishwakarmabuildandfurnish.in$request_uri;
}

server {
    server_name backend.vishwakarmabuildandfurnish.in;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 80;
    listen [::]:80;
}

# 301 Permanent Redirect: HTTP (port 80) to HTTPS non-www
server {
    listen 80;
    listen [::]:80;
    server_name vishwakarmabuildandfurnish.in www.vishwakarmabuildandfurnish.in;

    return 301 https://vishwakarmabuildandfurnish.in$request_uri;
}
